publish_period: 0.02
max_expected_latency: 0.1
move_group_name: uf850

command_in_type: speed_units
scale:
  linear: 0.01
  rotational: 0.1
  joint: 0.1
incoming_command_timeout: 0.1

cartesian_command_in_topic: /servo_node/delta_twist_cmds
joint_command_in_topic: /servo_node/delta_joint_cmds
joint_topic: /joint_states
status_topic: /servo_node/status
command_out_topic: /uf850_traj_controller/joint_trajectory
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
# The UF850 JointTrajectoryController rejects streaming messages whose final
# point contains nonzero velocity. Its selected command interface is position,
# so Servo must omit velocity and acceleration fields.
publish_joint_velocities: false
publish_joint_accelerations: false

is_primary_planning_scene_monitor: false
monitored_planning_scene_topic: /monitored_planning_scene
check_octomap_collisions: false
check_collisions: false
collision_check_rate: 20.0
# Collision checking is intentionally disabled for this Servo instance because
# it is used only for force-guarded vertical pickup/place descent. The carried
# item must be allowed to approach the pallet and registered support objects.
# MoveIt collision checking remains active for planned pre-grasp, transfer,
# retreat-to-observation, and all other trajectory motions. These thresholds
# remain valid if Servo collision checking is re-enabled later.
self_collision_proximity_threshold: 0.005
scene_collision_proximity_threshold: 0.005

use_smoothing: true
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
# Allow guarded vertical motion through moderately ill-conditioned postures.
# The monitor remains enabled: Servo begins scaling at 25 and still performs
# a hard stop at 45. Prefer changing the pre-place IK/posture if this limit is
# reached repeatedly instead of increasing it again.
lower_singularity_threshold: 25.0
hard_stop_singularity_threshold: 45.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.12]
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true
