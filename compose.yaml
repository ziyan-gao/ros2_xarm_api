services:
  ros2_cv:
    build: .
    container_name: ros2_cv
    stdin_open: true
    tty: true
    network_mode: host
    ipc: "host"
    # ros2_control requests FIFO scheduling for its control loop.  Without
    # SYS_NICE/rtprio the request is rejected and network/GUI load can delay a
    # Servo-J write long enough for the trajectory controller to jump ahead.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: -1
        hard: -1
    # Allow RealSense USB hot-plug without granting the container access to
    # every host device.
    device_cgroup_rules:
      - "c 189:* rmw"

    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1

    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOT_IP=${ROBOT_IP:-192.168.1.232}
      - XARM_REPORT_TYPE=${XARM_REPORT_TYPE:-dev}
      - START_MODE=${START_MODE:-unified}
      - SAFE_SERVO_DRY_RUN=${SAFE_SERVO_DRY_RUN:-false}
      - MOVEIT_SERVO_DRY_RUN=${MOVEIT_SERVO_DRY_RUN:-false}
      - SERVO_DESCENT_SPEED_M_S=${SERVO_DESCENT_SPEED_M_S:-0.05}
      - SERVO_DESCENT_KP_Z=${SERVO_DESCENT_KP_Z:-3.0}
      - PLACE_FORCE_THRESHOLD_N=${PLACE_FORCE_THRESHOLD_N:-4.0}
      - RVIZ_CONFIG=/workspace/ws/src/rviz_config/rviz_scene.rviz

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.docker.xauth:ro
      - /dev/bus/usb:/dev/bus/usb
      - ./:/workspace
      - ./config/xarm_user_params.yaml:/opt/xarm_ws/install/xarm_api/share/xarm_api/config/xarm_user_params.yaml:ro

    working_dir: /workspace
    command: ["bash", "/workspace/start.sh"]
