services:
  ros2_cv:
    build: .
    container_name: ros2_cv
    stdin_open: true
    tty: true
    network_mode: host
    ipc: "host"
    # ros2_control requests FIFO scheduling for its control loop.  Without
    # SYS_NICE/rtprio the request is rejected and network/GUI load can delay a
    # Servo-J write long enough for the trajectory controller to jump ahead.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: -1
        hard: -1
    # Allow RealSense USB hot-plug without granting the container access to
    # every host device.
    device_cgroup_rules:
      - "c 189:* rmw"

    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1

    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOT_IP=${ROBOT_IP:-192.168.1.232}
      - XARM_REPORT_TYPE=${XARM_REPORT_TYPE:-dev}
      - START_MODE=${START_MODE:-unified}
      - TOP_FACE_DEBUG_ENABLED=${TOP_FACE_DEBUG_ENABLED:-true}
      - TOP_FACE_SAM_CHECKPOINT=${TOP_FACE_SAM_CHECKPOINT:-/workspace/results/models/sam2.1_hiera_tiny.pt}
      - TOP_FACE_SAM_MODEL_CONFIG=${TOP_FACE_SAM_MODEL_CONFIG:-configs/sam2.1/sam2.1_hiera_t.yaml}
      - TOP_FACE_SAM_DEVICE=${TOP_FACE_SAM_DEVICE:-cpu}
      - TOP_FACE_SAM_THREADS=${TOP_FACE_SAM_THREADS:-2}
      - SAFE_SERVO_DRY_RUN=${SAFE_SERVO_DRY_RUN:-false}
      - MOVEIT_SERVO_DRY_RUN=${MOVEIT_SERVO_DRY_RUN:-false}
      - SERVO_DESCENT_SPEED_M_S=${SERVO_DESCENT_SPEED_M_S:-0.05}
      - SERVO_DESCENT_KP_Z=${SERVO_DESCENT_KP_Z:-3.0}
      - PICKUP_FORCE_THRESHOLD_N=${PICKUP_FORCE_THRESHOLD_N:-5.0}
      - PLACE_FORCE_THRESHOLD_N=${PLACE_FORCE_THRESHOLD_N:-4.0}
      - PLACE_DESCENT_TIMEOUT_SEC=${PLACE_DESCENT_TIMEOUT_SEC:-20.0}
      - PLACE_SINGULARITY_RECOVERY_TIMEOUT_SEC=${PLACE_SINGULARITY_RECOVERY_TIMEOUT_SEC:-20.0}
      - PLACE_SINGULARITY_STEP_M=${PLACE_SINGULARITY_STEP_M:-0.003}
      - PLACE_SINGULARITY_STEP_SPEED_MM_S=${PLACE_SINGULARITY_STEP_SPEED_MM_S:-10.0}
      - PLACE_SINGULARITY_DECELERATION_GRACE_SEC=${PLACE_SINGULARITY_DECELERATION_GRACE_SEC:-0.75}
      - PLACE_SINGULARITY_NO_PROGRESS_SEC=${PLACE_SINGULARITY_NO_PROGRESS_SEC:-1.0}
      - POST_RESTORE_SETTLE_SEC=${POST_RESTORE_SETTLE_SEC:-0.75}
      - DIRECT_TRANSFER_IK_TIMEOUT_SEC=${DIRECT_TRANSFER_IK_TIMEOUT_SEC:-2.0}
      - CONTINUOUS_TRANSPORT_ENABLED=${CONTINUOUS_TRANSPORT_ENABLED:-true}
      - CONTINUOUS_RETURN_ENABLED=${CONTINUOUS_RETURN_ENABLED:-true}
      - CONTINUOUS_TRANSPORT_BLEND_RADIUS_M=${CONTINUOUS_TRANSPORT_BLEND_RADIUS_M:-0.04}
      - TRANSPORT_OBSERVATION_Y_OFFSET_MM=${TRANSPORT_OBSERVATION_Y_OFFSET_MM:-200.0}
      - RAISED_PRE_PLACE_MAX_MM=${RAISED_PRE_PLACE_MAX_MM:-30.0}
      - RAISED_PRE_PICK_MAX_MM=${RAISED_PRE_PICK_MAX_MM:-30.0}
      - CONTINUOUS_TRANSPORT_MAX_JOINT_JERK_RAD_S3=${CONTINUOUS_TRANSPORT_MAX_JOINT_JERK_RAD_S3:-10.0}
      - CONTINUOUS_TRANSPORT_ENFORCE_JERK_LIMIT=${CONTINUOUS_TRANSPORT_ENFORCE_JERK_LIMIT:-false}
      - DIRECT_CARTESIAN_MAX_SPEED_MM_S=${DIRECT_CARTESIAN_MAX_SPEED_MM_S:-200.0}
      - DIRECT_CARTESIAN_MAX_ACCEL_MM_S2=${DIRECT_CARTESIAN_MAX_ACCEL_MM_S2:-500.0}
      - MOTION_SPEED_DEFAULT_PERCENT=${MOTION_SPEED_DEFAULT_PERCENT:-80.0}
      - CARTESIAN_TRANSPORT_SPEED_RATIO=${CARTESIAN_TRANSPORT_SPEED_RATIO:-0.35}
      - DEPTH_ONLY_SUPPORT_Z_M=${DEPTH_ONLY_SUPPORT_Z_M:-0.0}
      - DEPTH_ONLY_HEIGHT_OFFSET_M=${DEPTH_ONLY_HEIGHT_OFFSET_M:--0.02}
      - OBJECT_CONTACT_REFERENCE_Z_M=${OBJECT_CONTACT_REFERENCE_Z_M:-0.0}
      - DEPTH_ONLY_BASE_Z_MIN_M=${DEPTH_ONLY_BASE_Z_MIN_M:-0.07}
      - DEPTH_ONLY_BASE_Z_MAX_M=${DEPTH_ONLY_BASE_Z_MAX_M:-0.30}
      - DEPTH_ONLY_TCP_X_MIN_M=${DEPTH_ONLY_TCP_X_MIN_M:-0.05}
      - DEPTH_ONLY_TCP_X_MAX_M=${DEPTH_ONLY_TCP_X_MAX_M:-0.40}
      - DEPTH_ONLY_TCP_Y_MIN_M=${DEPTH_ONLY_TCP_Y_MIN_M:--0.30}
      - DEPTH_ONLY_TCP_Y_MAX_M=${DEPTH_ONLY_TCP_Y_MAX_M:-0.30}
      - RANDOM_LOADING_AUTO_START=${RANDOM_LOADING_AUTO_START:-false}
      - PICK_PLACE_TEST_MAX_STEPS=${PICK_PLACE_TEST_MAX_STEPS:-100}
      - PICK_PLACE_TEST_SEED=${PICK_PLACE_TEST_SEED:--1}
      - RANDOM_LOADING_CONFIG_PATH=${RANDOM_LOADING_CONFIG_PATH:-/opt/neuromeka_bin_packing/configs/real_platform_random.yaml}
      - POLICY_LOADING_CONFIG_PATH=${POLICY_LOADING_CONFIG_PATH:-/opt/neuromeka_bin_packing/configs/real_platform_policy.yaml}
      - STAGING_TRANSFER_BOTTOM_ABOVE_PALLET_M=${STAGING_TRANSFER_BOTTOM_ABOVE_PALLET_M:-0.480}
      - STAGING_SLOT_INSPECTION_ENABLED=${STAGING_SLOT_INSPECTION_ENABLED:-true}
      - STAGING_SLOT_INSPECTION_BACKOFF_M=${STAGING_SLOT_INSPECTION_BACKOFF_M:-0.100}
      - PLACE_WORKSPACE_Z_MIN_MM=${PLACE_WORKSPACE_Z_MIN_MM:--100.0}
      - TRANSPORT_WORKSPACE_Z_MAX_MM=${TRANSPORT_WORKSPACE_Z_MAX_MM:-800.0}
      - TRANSPORT_MOVEIT_FALLBACK_ENABLED=${TRANSPORT_MOVEIT_FALLBACK_ENABLED:-false}
      - TRANSPORT_MOVEIT_PRIMARY_ENABLED=${TRANSPORT_MOVEIT_PRIMARY_ENABLED:-false}
      - TRANSPORT_MOVEIT_DIRECT_ENABLED=${TRANSPORT_MOVEIT_DIRECT_ENABLED:-false}
      - TRANSPORT_MOVEIT_PIPELINE_ID=${TRANSPORT_MOVEIT_PIPELINE_ID:-ompl}
      - TRANSPORT_MOVEIT_PLANNER_ID=${TRANSPORT_MOVEIT_PLANNER_ID:-RRTstar}
      - CUMOTION_JOINT3_MIN_DEG=${CUMOTION_JOINT3_MIN_DEG:--130.0}
      - CUMOTION_JOINT5_MAX_DEG=${CUMOTION_JOINT5_MAX_DEG:-40.0}
      - CUMOTION_TRAJOPT_FINETUNE_ITERS=${CUMOTION_TRAJOPT_FINETUNE_ITERS:-50}
      - CUMOTION_CLEARANCE_BARRIERS_ENABLED=${CUMOTION_CLEARANCE_BARRIERS_ENABLED:-true}
      - CUMOTION_SLOT_CLEARANCE_Z_M=${CUMOTION_SLOT_CLEARANCE_Z_M:-0.480}
      - CUMOTION_BARRIER_TOP_MARGIN_M=${CUMOTION_BARRIER_TOP_MARGIN_M:-0.003}
      - TRANSPORT_MOVEIT_CLEARANCE_CONSTRAINT_ENABLED=${TRANSPORT_MOVEIT_CLEARANCE_CONSTRAINT_ENABLED:-false}
      - TRANSPORT_SLOT_CLEARANCE_Z_M=${TRANSPORT_SLOT_CLEARANCE_Z_M:-0.0}
      - TRANSPORT_EMPTY_TOOL_DROP_M=${TRANSPORT_EMPTY_TOOL_DROP_M:-0.030}
      - TRANSPORT_MAX_PAYLOAD_DROP_M=${TRANSPORT_MAX_PAYLOAD_DROP_M:-0.300}
      - TRANSPORT_LOCAL_CLEARANCE_VALIDATION_ENABLED=${TRANSPORT_LOCAL_CLEARANCE_VALIDATION_ENABLED:-false}
      - TRANSPORT_EXPANDED_WAYPOINTS_ENABLED=${TRANSPORT_EXPANDED_WAYPOINTS_ENABLED:-true}
      - TRANSPORT_WAYPOINT_SEARCH_TIMEOUT_SEC=${TRANSPORT_WAYPOINT_SEARCH_TIMEOUT_SEC:-180.0}
      - RANDOM_LOADING_VISUALIZE=${RANDOM_LOADING_VISUALIZE:-true}
      - RANDOM_LOADING_VISUAL_PORT=${RANDOM_LOADING_VISUAL_PORT:-8765}
      - POLICY_LOADING_CHECKPOINT=${POLICY_LOADING_CHECKPOINT:-/opt/neuromeka_bin_packing/train_outputs/cardboard_xy_random_clearance20/policy_step.pth}
      - POLICY_LOADING_DEVICE=${POLICY_LOADING_DEVICE:-cpu}
      - POLICY_LOADING_VISUALIZE=${POLICY_LOADING_VISUALIZE:-true}
      - POLICY_LOADING_VISUAL_PORT=${POLICY_LOADING_VISUAL_PORT:-8766}
      - PYTHONPATH=/opt/neuromeka_bin_packing
      - RVIZ_CONFIG=/workspace/ws/src/rviz_config/rviz_scene.rviz

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.docker.xauth:ro
      - /dev/bus/usb:/dev/bus/usb
      - ./:/workspace
      - ../../neuromeka_bin_packing:/opt/neuromeka_bin_packing:ro
      - ./config/xarm_user_params.yaml:/opt/xarm_ws/install/xarm_api/share/xarm_api/config/xarm_user_params.yaml:ro

    working_dir: /workspace
    command: ["bash", "/workspace/start.sh"]
